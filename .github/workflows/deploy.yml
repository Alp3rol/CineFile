name: Deploy web

# This workflow is the canonical way the published site is built.
#
# The script still works and is still the right tool for a quick local preview,
# but it was the only path to production and that made deployment fragile in
# three specific ways: it ran on one person's Windows machine, it
# `git push --force`d over gh-pages so a bad deploy could not be rolled back,
# and nothing recorded which source commit the live site was built from.
#
# Here the trigger is a version tag, so the live site always corresponds to a
# commit you can name, and the publish step keeps history instead of
# overwriting it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy'
        required: false
        default: 'main'

permissions:
  contents: write

concurrency:
  # Two deploys racing to force the same branch is how gh-pages ends up in a
  # state nobody can explain.
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # api_key.dart is git-ignored. Whatever key this build should use comes
      # from a secret below, never from the working tree.
      - name: Create placeholder TMDb API key
        run: |
          cat > lib/core/constants/api_key.dart <<'EOF'
          // Generated by CI — see .github/workflows/deploy.yml
          const String defaultTmdbApiKey = '';
          EOF

      - run: flutter pub get

      - name: Check package and displayed version
        # Direct script execution avoids invoking unrelated package build
        # hooks (notably sqlite3's native download) for this source-only check.
        run: dart tool/check_version_sync.dart

      - name: Generate release metadata
        id: release
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          COMMIT=$(git rev-parse --short=12 HEAD)
          if [ -z "$VERSION" ] || [ -z "$COMMIT" ]; then
            echo "::error::Production release metadata could not be generated."
            exit 1
          fi
          echo "release=cinefile@$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "environment=production" >> "$GITHUB_OUTPUT"
          echo "Sentry release: cinefile@$VERSION ($COMMIT, production)"

      # Refuse to publish a build that would embed a key in main.dart.js unless
      # that was asked for explicitly. TMDb takes the key as a query parameter,
      # so anything compiled in is served to every visitor.
      - name: Choose how this build reaches TMDb
        id: tmdb
        env:
          PROXY_URL: ${{ secrets.TMDB_PROXY_URL }}
          WEB_KEY: ${{ secrets.TMDB_WEB_KEY }}
        run: |
          if [ -n "$PROXY_URL" ]; then
            echo "Using proxy; no key will be embedded."
            echo "defines=--dart-define=TMDB_PROXY_URL=$PROXY_URL" >> "$GITHUB_OUTPUT"
            echo "uses_proxy=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$WEB_KEY" ]; then
            echo "::warning::No TMDB_PROXY_URL set. The key in TMDB_WEB_KEY will be embedded in main.dart.js and is public. See tools/tmdb-proxy/README.md."
            echo "defines=--dart-define=TMDB_API_KEY=$WEB_KEY" >> "$GITHUB_OUTPUT"
            echo "uses_proxy=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Neither TMDB_PROXY_URL nor TMDB_WEB_KEY is set — deploying in offline demo mode."
            echo "defines=" >> "$GITHUB_OUTPUT"
            echo "uses_proxy=false" >> "$GITHUB_OUTPUT"
          fi

      # Optional, unlike the TMDb step above: with no SENTRY_DSN secret the app
      # compiles Sentry out entirely rather than shipping a broken reporter, so
      # a fork or a first deploy still builds. A DSN is not a secret — it only
      # grants the ability to submit events — but it is passed the same way as
      # the other values so it belongs to the deployment, not the repo.
      - name: Decide whether this build reports crashes
        id: sentry
        env:
          DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -n "$DSN" ]; then
            echo "Crashes will be reported to Sentry."
            echo "defines=--dart-define=SENTRY_DSN=$DSN" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No SENTRY_DSN set — this build will not report crashes anywhere."
            echo "defines=" >> "$GITHUB_OUTPUT"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # The same gates as CI, because a tag can be pushed without a PR.
      - run: flutter analyze
      - run: flutter test

      - name: Build web
        env:
          # Public reCAPTCHA Enterprise site key restricted to
          # alp3rol.github.io. It identifies the site; it is not a credential.
          APP_CHECK_WEB_SITE_KEY: 6Le_jYItAAAAAFTDS8bvR9FMiFG8zJn7LeHJOlQH
          SENTRY_RELEASE: ${{ steps.release.outputs.release }}
          SENTRY_COMMIT: ${{ steps.release.outputs.commit }}
          SENTRY_ENVIRONMENT: ${{ steps.release.outputs.environment }}
        run: |
          test -n "$APP_CHECK_WEB_SITE_KEY" && test -n "$SENTRY_RELEASE" && test -n "$SENTRY_COMMIT" && test -n "$SENTRY_ENVIRONMENT"
          flutter build web --release --no-wasm-dry-run \
            --base-href "/CineFile/" \
            ${{ steps.tmdb.outputs.defines }} ${{ steps.sentry.outputs.defines }} \
            --dart-define=APP_CHECK_WEB_SITE_KEY="$APP_CHECK_WEB_SITE_KEY" \
            --dart-define=SENTRY_RELEASE="$SENTRY_RELEASE" \
            --dart-define=SENTRY_COMMIT="$SENTRY_COMMIT" \
            --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT"

      - name: Verify release metadata in bundle
        if: steps.sentry.outputs.enabled == 'true'
        env:
          SENTRY_RELEASE: ${{ steps.release.outputs.release }}
          SENTRY_COMMIT: ${{ steps.release.outputs.commit }}
          SENTRY_ENVIRONMENT: ${{ steps.release.outputs.environment }}
        run: |
          for value in "$SENTRY_RELEASE" "$SENTRY_COMMIT" "$SENTRY_ENVIRONMENT"; do
            if ! grep -qF "$value" build/web/main.dart.js; then
              echo "::error::Release metadata '$value' is missing from the production bundle."
              exit 1
            fi
          done

      # Guard against the exact failure this arrangement exists to prevent: a
      # proxy build that nonetheless shipped a key. Greps for the literal secret
      # rather than for "something 32 hex characters long" — a compiled bundle
      # contains plenty of hashes, and a check that cries wolf gets disabled.
      - name: Verify the bundle carries no key
        if: steps.tmdb.outputs.uses_proxy == 'true'
        env:
          WEB_KEY: ${{ secrets.TMDB_WEB_KEY }}
        run: |
          if [ -n "$WEB_KEY" ] && grep -qF "$WEB_KEY" build/web/main.dart.js; then
            echo "::error::TMDB_WEB_KEY is present in main.dart.js despite the proxy being configured."
            exit 1
          fi
          if grep -qF 'api_key=' build/web/main.dart.js && \
             grep -qEo 'api_key=[0-9a-f]{32}' build/web/main.dart.js; then
            echo "::error::A literal api_key=<32 hex> pair is baked into the bundle."
            exit 1
          fi
          echo "No key found in the bundle."

      - uses: peaceiris/actions-gh-pages@v4
        with:
          # Two different identities are at play here, and they are set
          # separately because GitHub records them separately.
          #
          # user_name/user_email below set the *commit author* on gh-pages.
          # That is the one that matters: it is what keeps a bot off the
          # repository's contributor list, and it has always been correct.
          #
          # The token sets who *pushed*, which is what GitHub attributes the
          # resulting Pages deployment to on the Deployments page. With
          # GITHUB_TOKEN the push belongs to the workflow rather than to a
          # person, so that page reads "github-pages[bot]". Supplying a
          # personal access token instead makes it read the owner's name.
          #
          # The fallback keeps this working when GH_PAGES_PAT is not set:
          # deploys still run, they are just attributed to the bot as before.
          # Add the secret and the attribution corrects itself on the next run,
          # with no further change to this file.
          personal_token: ${{ secrets.GH_PAGES_PAT || secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          # force_orphan defaults to false, so gh-pages keeps its history and a
          # bad deploy can be reverted rather than only overwritten.
          commit_message: 'deploy: ${{ github.sha }}'
          # Attributed to the repository owner, matching the former local
          # deployment flow. Using the default github-actions[bot]
          # identity instead adds a bot to the repository's contributor list.
          user_name: 'Alp3rol'
          user_email: 'alp3rol17@gmail.com'
