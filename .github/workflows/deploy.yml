name: Deploy web

# Replaces yayinla.bat as the way the published site is built.
#
# The script still works and is still the right tool for a quick local preview,
# but it was the only path to production and that made deployment fragile in
# three specific ways: it ran on one person's Windows machine, it
# `git push --force`d over gh-pages so a bad deploy could not be rolled back,
# and nothing recorded which source commit the live site was built from.
#
# Here the trigger is a version tag, so the live site always corresponds to a
# commit you can name, and the publish step keeps history instead of
# overwriting it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy'
        required: false
        default: 'main'

permissions:
  contents: write

concurrency:
  # Two deploys racing to force the same branch is how gh-pages ends up in a
  # state nobody can explain.
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # api_key.dart is git-ignored. Whatever key this build should use comes
      # from a secret below, never from the working tree.
      - name: Create placeholder TMDb API key
        run: |
          cat > lib/core/constants/api_key.dart <<'EOF'
          // Generated by CI — see .github/workflows/deploy.yml
          const String defaultTmdbApiKey = '';
          EOF

      - run: flutter pub get

      # Refuse to publish a build that would embed a key in main.dart.js unless
      # that was asked for explicitly. TMDb takes the key as a query parameter,
      # so anything compiled in is served to every visitor.
      - name: Choose how this build reaches TMDb
        id: tmdb
        env:
          PROXY_URL: ${{ secrets.TMDB_PROXY_URL }}
          WEB_KEY: ${{ secrets.TMDB_WEB_KEY }}
        run: |
          if [ -n "$PROXY_URL" ]; then
            echo "Using proxy; no key will be embedded."
            echo "defines=--dart-define=TMDB_PROXY_URL=$PROXY_URL" >> "$GITHUB_OUTPUT"
            echo "uses_proxy=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$WEB_KEY" ]; then
            echo "::warning::No TMDB_PROXY_URL set. The key in TMDB_WEB_KEY will be embedded in main.dart.js and is public. See tools/tmdb-proxy/README.md."
            echo "defines=--dart-define=TMDB_API_KEY=$WEB_KEY" >> "$GITHUB_OUTPUT"
            echo "uses_proxy=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Neither TMDB_PROXY_URL nor TMDB_WEB_KEY is set — deploying in offline demo mode."
            echo "defines=" >> "$GITHUB_OUTPUT"
            echo "uses_proxy=false" >> "$GITHUB_OUTPUT"
          fi

      # The same gates as CI, because a tag can be pushed without a PR.
      - run: flutter analyze
      - run: flutter test

      - name: Build web
        run: |
          flutter build web --release --no-wasm-dry-run \
            --base-href "/CineFile/" ${{ steps.tmdb.outputs.defines }}

      # Guard against the exact failure this arrangement exists to prevent: a
      # proxy build that nonetheless shipped a key. Greps for the literal secret
      # rather than for "something 32 hex characters long" — a compiled bundle
      # contains plenty of hashes, and a check that cries wolf gets disabled.
      - name: Verify the bundle carries no key
        if: steps.tmdb.outputs.uses_proxy == 'true'
        env:
          WEB_KEY: ${{ secrets.TMDB_WEB_KEY }}
        run: |
          if [ -n "$WEB_KEY" ] && grep -qF "$WEB_KEY" build/web/main.dart.js; then
            echo "::error::TMDB_WEB_KEY is present in main.dart.js despite the proxy being configured."
            exit 1
          fi
          if grep -qF 'api_key=' build/web/main.dart.js && \
             grep -qEo 'api_key=[0-9a-f]{32}' build/web/main.dart.js; then
            echo "::error::A literal api_key=<32 hex> pair is baked into the bundle."
            exit 1
          fi
          echo "No key found in the bundle."

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          # force_orphan defaults to false, so gh-pages keeps its history and a
          # bad deploy can be reverted rather than only overwritten.
          commit_message: 'deploy: ${{ github.sha }}'
          # Attributed to the repository owner, matching what yayinla.bat did
          # when deploys ran locally. Using the default github-actions[bot]
          # identity instead adds a bot to the repository's contributor list.
          user_name: 'Alp3rol'
          user_email: 'alp3rol17@gmail.com'
