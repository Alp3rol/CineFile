name: CI

# Runs the checks that used to only exist on a developer's machine. The test
# suite had 17 files failing to even compile for a while without anyone
# noticing, because `flutter analyze` (which was the only thing being run) does
# not compile tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # api_key.dart is git-ignored (it holds a real TMDb key), so CI has to
      # synthesise one. An empty key is the app's documented offline/demo mode,
      # which is exactly what the tests exercise — none of them hit the network.
      - name: Create placeholder TMDb API key
        run: |
          cat > lib/core/constants/api_key.dart <<'EOF'
          // Generated by CI — see .github/workflows/ci.yml
          const String defaultTmdbApiKey = '';
          EOF

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test
