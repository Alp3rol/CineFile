name: CI

# Runs the checks that used to only exist on a developer's machine. The test
# suite had 17 files failing to even compile for a while without anyone
# noticing, because `flutter analyze` (which was the only thing being run) does
# not compile tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scan tracked files for secrets
        run: |
          dart tool/check_secrets.dart --self-test
          dart tool/check_secrets.dart

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tools/tmdb-proxy/package-lock.json
            test_rules/package-lock.json

      - name: Audit TMDb proxy dependencies
        working-directory: tools/tmdb-proxy
        run: npm audit --audit-level=high

      - name: Audit Firestore test dependencies
        working-directory: test_rules
        run: npm audit --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  tmdb-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/tmdb-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/tmdb-proxy/package-lock.json
      - run: npm ci
      - name: Test atomic proxy quota
        run: npm test
      - name: Validate Cloudflare deployment
        run: npx wrangler deploy --dry-run

  synthetic-health-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test synthetic health diagnostics
        run: node --test test/synthetic_health_check_test.mjs

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # api_key.dart is git-ignored (it holds a real TMDb key), so CI has to
      # synthesise one. An empty key is the app's documented offline/demo mode,
      # which is exactly what the tests exercise — none of them hit the network.
      - name: Create placeholder TMDb API key
        run: |
          cat > lib/core/constants/api_key.dart <<'EOF'
          // Generated by CI — see .github/workflows/ci.yml
          const String defaultTmdbApiKey = '';
          EOF

      - run: flutter pub get

      # Regenerates AppLocalizations and, via l10n.yaml's
      # untranslated-messages-file, reports any key present in the template
      # (app_tr.arb) but missing from a translation. A string can never ship
      # in one language only.
      - name: Check for untranslated messages
        run: |
          flutter gen-l10n
          if [ -s l10n_missing.json ] && [ "$(cat l10n_missing.json)" != "{}" ]; then
            echo "Untranslated messages:"
            cat l10n_missing.json
            exit 1
          fi

      # Backstop against a localized feature quietly hardcoding Turkish again.
      - name: Check for hardcoded Turkish
        run: dart run tool/check_localized.dart

      # The package version drives store builds and Sentry releases, while the
      # Settings footer is compiled UI. Fail before release if they drift.
      - name: Check package and displayed version
        run: dart run tool/check_version_sync.dart

      - run: flutter analyze

      - name: Test Sentry release metadata contract
        run: flutter test test/error_reporting_test.dart

      # --coverage so the number is visible on every run. There is deliberately
      # no failing threshold yet: the suite covers domain logic well and the
      # widget layer thinly, so a gate set at today's number would mostly
      # measure how much UI a change touches. Add one once the repository
      # abstraction lands and the untestable-by-construction code shrinks.
      - name: Run tests with coverage and timings
        run: >-
          flutter test --coverage
          --file-reporter json:build/test-timings.json

      - name: Report slowest test files
        run: dart run tool/summarize_test_timings.dart | tee build/test-timing-report.md

      - name: Enforce coverage baseline
        run: >-
          dart run tool/check_coverage.dart coverage/lcov.info
          --minimum=50
          --domain-minimum=80

      - uses: actions/upload-artifact@v7
        with:
          name: test-quality-reports
          path: |
            coverage/lcov.info
            build/test-timing-report.md

      # Whether the app talks to TMDb directly or through the proxy is a
      # compile-time decision, so the run above only ever exercises one of the
      # two. Without this the proxy path could stop compiling — or start
      # serving demo data for everything — and nothing would notice until a
      # release was built against it.
      - name: Test the proxy build path
        run: >-
          flutter test
          test/tmdb_proxy_mode_test.dart
          test/tmdb_proxy_allowlist_test.dart
          --dart-define=TMDB_PROXY_URL=https://proxy.invalid

  # Every authorization decision in this app lives in firestore.rules, and
  # nothing was exercising it — three real holes (username impersonation,
  # forged post authorship, pre-stuffed starredBy) shipped because a rules
  # change has no compiler and no reviewer can hold the whole matrix in their
  # head. These run against the Firestore emulator, which needs Java.
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test_rules/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install rules-test dependencies
        working-directory: test_rules
        run: npm ci

      - name: Run firestore.rules tests
        working-directory: test_rules
        run: npm test
