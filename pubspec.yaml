name: cinefile
description: "CineFile — film ve dizi izleme günlüğü, analiz ve topluluk uygulaması."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.0+13

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.1
  drift: ^2.34.1
  sqlite3: ^3.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.10.0
  dio_cache_interceptor: ^3.5.0
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  # Loosened from ^0.20.3: flutter_localizations pins intl to exactly the
  # version bundled with the SDK (0.20.2 as of Flutter 3.44), so anything
  # stricter makes dependency resolution fail.
  intl: ^0.20.2
  fl_chart: ^1.2.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  shared_preferences_web: ^2.4.3
  share_plus: ^13.2.0
  visibility_detector: ^0.4.0+2
  firebase_core: ^4.11.0
  firebase_core_web: ^3.9.0
  firebase_auth: ^6.5.7
  firebase_auth_web: ^6.2.3
  cloud_firestore: ^6.6.0
  cloud_firestore_web: ^5.6.0
  meta: ^1.11.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  # Crash reporting. Sentry rather than Crashlytics because the release this
  # project actually publishes is the web build (see .github/workflows/
  # deploy.yml), and firebase_crashlytics has no web support at all — it would
  # have left the one shipped surface unmonitored.
  #
  # Its Android side depends on jni 0.14.x, which holds path_provider_android
  # at 2.2.x instead of 2.3.x. Both are Android-only plugins the web build
  # never loads, so the cost lands entirely on a platform that has no release
  # channel yet; revisit when sentry_flutter moves to jni 1.x.
  sentry_flutter: ^9.26.0
  firebase_app_check: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^4.1.1
  firebase_auth_mocks: ^0.15.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Pinned below 2.34.1+1: that release requires analyzer ^13, which is
  # incompatible with the `test` version flutter_test's pinned test_api 0.7.11
  # allows — and riverpod 3 depends on `test` directly. Revisit when a Flutter
  # stable ships a newer test_api.
  drift_dev: 2.34.0
  build_runner: ^2.15.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

# App icon generation (dart run flutter_launcher_icons). Source images live
# in assets/icon/ — app_icon.png is the square "ticket badge" crop of the
# full CineFile logo (assets/icon/splash_logo.png, used for the splash
# screen below), simplified because the full detailed ticket illustration
# becomes an illegible blur at actual launcher-icon sizes.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # The App Store rejects icons with transparency — flatten onto the app's
  # own dark background instead of flutter_launcher_icons' white default.
  remove_alpha_ios: true
  background_color_ios: "#0B0D13"
  adaptive_icon_background: "#0B0D13"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B0D13"
    theme_color: "#E8362E"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"

# Native splash screen generation (dart run flutter_native_splash:create).
# Legacy/iOS/web splash uses the full detailed ticket logo (plenty of room
# to read at full-screen size); Android 12+'s splash API constrains content
# to a small centered icon like an adaptive icon, so it reuses the same
# safe-zone-padded foreground crop as the launcher icon above.
flutter_native_splash:
  color: "#0B0D13"
  image: assets/icon/splash_logo.png
  android_12:
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#0B0D13"
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Runs `flutter gen-l10n` (configured by l10n.yaml) as part of run/build/test
  # so the generated AppLocalizations always matches the .arb files.
  generate: true

  assets:
    - assets/images/tmdb_logo.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
